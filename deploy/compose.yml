services:
  portainer-mcp:
    # Pin the Portainer minor this stack runs against (2.45.x for Portainer 2.45.x).
    image: docker.io/portainer/portainer-mcp:2.45
    restart: unless-stopped
    environment:
      PORTAINER_URL: https://192.168.1.200:9443
      # Portainer's own 9443 listener uses a self-signed certificate.
      PORTAINER_TLS_VERIFY: "0"

      PORTAINER_MCP_TRANSPORT: http
      PORTAINER_MCP_HTTP_HOST: 0.0.0.0
      PORTAINER_MCP_HTTP_PORT: "17717"
      # DNS-rebinding allowlist must name the address clients actually use.
      PORTAINER_MCP_ALLOWED_HOSTS: 192.168.1.200:17717,portainer-mcp.agser.lan:17717,127.0.0.1:17717,localhost:17717

      # Server-terminated TLS: no plaintext hop exists, and TLSRequiredMiddleware
      # rejects plain-HTTP requests before any API key is validated.
      PORTAINER_MCP_TLS_CERT: /tls/server.crt
      PORTAINER_MCP_TLS_KEY: /tls/server.key

      PORTAINER_PROFILES: BASE,DOCKER
      PORTAINER_TAGS_EXTRA: observability
      PORTAINER_MCP_LOG_FORMAT: json

      # Shared bearer gate. Comes from the stack's environment variables in
      # Portainer and is never committed here. Clients send it as
      # `Authorization: Bearer <token>` plus their own key in `X-Portainer-API-Key`.
      # Unset means the server refuses to boot (fail-closed).
      PORTAINER_MCP_AUTH_TOKEN: ${PORTAINER_MCP_AUTH_TOKEN}
    volumes:
      # Certificates live in a Docker volume, not in the repository: the git
      # source is public. Create it once and re-seed with `docker cp` after
      # rotation.
      - portainer-mcp-tls:/tls:ro
    ports:
      - "17717:17717"

volumes:
  # Pre-created out-of-band (`docker volume create portainer-mcp-tls`); compose
  # must not try to own it, or it looks for a project-scoped volume instead.
  portainer-mcp-tls:
    external: true
